# =============================================================================
# LCR-Agent 主配置（实验配置）
# 说明：
#   - 该文件描述「一次实验/一套部署」的完整行为，便于对比不同配置的效果；
#   - 敏感信息（API Key）永远不写在这里，只放在 .env；
#   - 脚本 scripts/build_index.py 与实验入口都通过 --config 指定本文件。
# =============================================================================

name: default
version: 0.1.0
description: 默认配置：混合检索 + 全量 Agent 链路的合同审查

# ------------------------------------------------------------------ 运行环境
runtime:
  app_env: dev
  log_level: INFO
  # LangGraph 检查点：内存 / sqlite / postgres（脚手架阶段仅实现内存）
  checkpointer: memory

# ---------------------------------------------------------------------- LLM
llm:
  provider: openai-compatible
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 2048
  timeout: 60
  max_retries: 2

# ------------------------------------------------------------------ 文档解析
parsing:
  # 每个 chunk 的 token 上限 / 重叠量
  chunk_size: 800
  chunk_overlap: 120
  encoding: cl100k_base
  pdf:
    extract_tables: true
  docx:
    include_tables: true

# ---------------------------------------------------------------------- 检索
retrieval:
  enabled: true
  mode: hybrid           # bm25 | vector | hybrid
  top_k: 5
  top_k_vector: 20
  top_k_bm25: 20
  rrf_k: 60
  min_score: 0.2
  embedding:
    backend: sentence-transformers
    model: BAAI/bge-m3
    device: cpu
    batch_size: 32
  vector_store:
    backend: chroma
    collection: cuad_clauses
  corpora:
    - cuad
    - playbook

# ---------------------------------------------------------------------- Agent
agents:
  clause_extractor:
    enabled: true
    batch_size: 25
    preview_chars: 200
  risk_reviewer:
    enabled: true
    max_clauses: 40
    min_severity: low
    use_retrieval: true
  compliance_checker:
    enabled: true
    playbook: playbook.yaml
  summarizer:
    enabled: true
    max_issues_in_prompt: 20

# ------------------------------------------------------------------- 报告输出
report:
  language: zh-CN
  include_trace: true
  include_citations: true
  # 高风险及以上是否阻断（用于 CI 门禁场景）
  block_on: high
