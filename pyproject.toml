[tool.poetry]
name = "lcr-agent"
version = "0.1.0"
description = "Legal Contract Review Agent —— 基于 LangGraph 的合同审查智能体"
authors = ["Alex <alex@example.com>"]
readme = "README.md"
license = "MIT"

# src/ 作为源码根（flat src layout）：每个子目录都是一个顶层包
packages = [
    { include = "config.py", from = "src" },
    { include = "parsing", from = "src" },
    { include = "agents", from = "src" },
    { include = "knowledge", from = "src" },
    { include = "graph", from = "src" },
    { include = "api", from = "src" },
    { include = "schemas", from = "src" },
]

include = ["configs/*.yaml"]

[tool.poetry.dependencies]
python = "^3.11"

# --- 编排 / LLM ---
langgraph = "^0.2.60"
langchain = "^0.3.13"
langchain-core = "^0.3.28"
langchain-community = "^0.3.13"
langchain-openai = "^0.2.14"

# --- 数据校验 / 配置 ---
pydantic = "^2.10.4"
pydantic-settings = "^2.7.0"
pyyaml = "^6.0.2"

# --- Web ---
fastapi = "^0.115.6"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
python-multipart = "^0.0.20"

# --- 文档解析 ---
pdfplumber = "^0.11.4"
python-docx = "^1.1.2"

# --- 检索 ---
rank-bm25 = "^0.2.2"
sentence-transformers = "^3.3.1"
chromadb = "^0.5.23"

# --- 工具 ---
tiktoken = "^0.8.0"
numpy = "^1.26.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.1"
ruff = "^0.8.4"
mypy = "^1.14.0"
ipython = "^8.31.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------
# 工具配置
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: 需要真实 LLM / 向量模型 / 外部网络的集成测试",
    "slow: 耗时较长的测试（默认不随 make test-unit 运行）",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/.venv/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RET", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
namespace_packages = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
ignore_missing_imports = true
